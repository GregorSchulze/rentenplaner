name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Standardmäßig keine Rechte; jeder Job bekommt nur, was er braucht.
# Actions sind auf Commit-SHAs gepinnt (Version im Kommentar), Dependabot hält sie aktuell.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages liest die Pages-Einstellungen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Keine Install-Skripte von Abhängigkeiten ausführen (keins davon wird gebraucht)
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  # Nur dieser Job darf veröffentlichen; hier läuft kein Code aus npm-Paketen.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
