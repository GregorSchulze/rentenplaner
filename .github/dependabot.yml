# Wöchentliche Updates für npm-Pakete und GitHub Actions.
# cooldown: neue Versionen erst nach 7 Tagen vorschlagen, damit kompromittierte Releases
# meist schon entdeckt und zurückgezogen sind. Sicherheitsupdates kommen ohne Wartezeit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
